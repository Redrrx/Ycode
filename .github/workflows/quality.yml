name: Ycode quality

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  quality:
    name: Ycode quality (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install Ycode in a temporary Pi profile
        env:
          PI_CODING_AGENT_DIR: ${{ runner.temp }}/ycode-agent
        run: npm run setup
      - name: Check host command execution
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { createProjectDatabase } from './src/project/database.ts';
          import { createExecutionStore } from './src/project/execution.ts';
          import { createCommandRunner } from './src/runtime/commands.ts';
          import { repositoryExecutable } from './src/repository/commands.ts';
          import { execFileSync } from 'node:child_process';
          const db = createProjectDatabase(':memory:', process.cwd());
          const store = createExecutionStore(db, 'ci', 1);
          const runner = createCommandRunner(store, new AbortController().signal, () => {});
          try {
            const run = await runner.start(process.cwd(), {command: 'echo ycode-ci; exit 7'}, false, {});
            assert.equal(run.status, 'failed');
            assert.equal(run.exit_code, 7);
            assert.match(store.tail(run.id), /ycode-ci/);
            for (const name of ['rg', 'ast-grep']) execFileSync(await repositoryExecutable(name), ['--version']);
          } finally {
            await runner.dispose();
            db.close();
          }
          JS
      - name: Enforce quality gate
        run: npm run quality
